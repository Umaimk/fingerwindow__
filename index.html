<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finger Window // Cyber</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Finger<span>//</span>Window</h1>
    <p class="sub">Frame a window between your hands. Jack into the neon grid.</p>

    <div class="stage">
      <canvas id="out" width="960" height="540"></canvas>
      <div id="status">SYSTEM READY. Press “Start camera” or load a video.</div>
    </div>

    <section class="controls">
      <div class="row">
        <button id="btnCam">Start camera</button>
        <label class="file">Load video<input id="fileSrc" type="file" accept="video/*" hidden /></label>
        <label class="file">Load AI clip (optional)<input id="fileAi" type="file" accept="video/*" hidden /></label>
        <button id="btnRec" disabled>● Record</button>
      </div>

      <div class="row">
        <label>Inside window
          <select id="mode">
            <option value="comic">Live comic filter</option>
            <option value="ai">My AI clip (needs loaded video)</option>
          </select>
        </label>
        <label>Style
          <select id="style">
            <option value="anime" selected>Neon anime (cyber character)</option>
            <option value="cyber">Cyberpunk (neon)</option>
            <option value="cartoon">Cartoon (cel-shaded)</option>
            <option value="comic">Comic (halftone)</option>
            <option value="sketch">Pencil sketch</option>
          </select>
        </label>
        <label><input type="checkbox" id="mirror" checked /> Mirror</label>
        <label><input type="checkbox" id="border" checked /> Panel border</label>
      </div>

      <div class="row">
        <label>Colour levels <input type="range" id="levels" min="2" max="8" value="4" /></label>
        <label>Outline strength <input type="range" id="edge" min="30" max="400" value="110" /></label>
        <label>Smoothing <input type="range" id="smooth" min="5" max="90" value="35" /></label>
        <label>Glow <input type="range" id="glow" min="0" max="100" value="35" /></label>
        <label>Glitch FX <input type="range" id="fx" min="0" max="100" value="40" /></label>
        <label>Quality
          <select id="quality">
            <option value="480">Fast (480p)</option>
            <option value="640" selected>Balanced (640p)</option>
            <option value="960">High (960p)</option>
          </select>
        </label>
      </div>
    </section>
  </main>

  <video id="src" playsinline muted hidden></video>
  <video id="ai" playsinline muted hidden></video>

  <script type="module" src="app.js"></script>
</body>
</html>
